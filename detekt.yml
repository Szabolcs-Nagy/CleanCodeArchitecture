build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true

output-reports:
  active: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
  MatchingDeclarationName:
    active: false
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z_][A-Za-z0-9_]*)*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*|[A-Za-z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    active: true
    ignoreDefaultParameters: true

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
  WildcardImport:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false

